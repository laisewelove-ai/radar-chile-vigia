name: Vigia do Radar Chile

# A cada 4 horas. O radar atualiza das 09h às 17h no Chile, então seis
# verificações por dia pegam qualquer parada em poucas horas, e não em cinco
# dias como no apagão de agosto de 2026.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir se o Radar Chile está vivo
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 vigia.py
